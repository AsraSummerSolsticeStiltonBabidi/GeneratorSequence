:root{
  --paper:#FCFBFD; --surface:#FFFFFF;
  --ink:#17151E; --ink-2:#443F4F; --muted:#6C6779;
  --line:#E2DFE9; --line-strong:#C7C2D3;
  --tint:15%; --tint-hi:30%;
  --cl:0.505; --cc:0.16;
  --chain1:#D93A3E; --chain2:#2E63E7; --onchip:#FFFFFF;
  --shadow:0 1px 2px rgba(23,21,30,.05), 0 8px 24px -18px rgba(23,21,30,.5);
  --caret:#6C6779; --bad:#C92C2C; --scrim:rgba(23,21,30,.45);
  --k1lab:#A0242A; --k2lab:#1C46B4;
  --warn:#C9821B; --warn-ink:#8A4B00; --warn-bg:#FFF7EA;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111017; --surface:#18161F;
    --ink:#F3F0F8; --ink-2:#C6C0D3; --muted:#948DA5;
    --line:#2D2936; --line-strong:#413B50;
    --tint:24%; --tint-hi:40%;
    --cl:0.80; --cc:0.145;
    --chain1:#E4575B; --chain2:#4E7DF2; --onchip:#FFFFFF;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.9);
    --caret:#948DA5; --bad:#FF7B7B; --scrim:rgba(0,0,0,.6);
    --k1lab:#FF9DA0; --k2lab:#9DB8FF;
    --warn:#D9A253; --warn-ink:#F7C578; --warn-bg:#241D14;
  }
}
:root[data-theme="dark"]{
  --paper:#111017; --surface:#18161F;
  --ink:#F3F0F8; --ink-2:#C6C0D3; --muted:#948DA5;
  --line:#2D2936; --line-strong:#413B50;
  --tint:24%; --tint-hi:40%;
  --cl:0.80; --cc:0.145;
  --chain1:#E4575B; --chain2:#4E7DF2; --onchip:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.9);
  --caret:#948DA5; --bad:#FF7B7B; --scrim:rgba(0,0,0,.6);
  --k1lab:#FF9DA0; --k2lab:#9DB8FF;
  --warn:#D9A253; --warn-ink:#F7C578; --warn-bg:#241D14;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Comic Neue","Comic Sans MS","Chalkboard SE","Segoe Print",cursive;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.app{max-width:1220px; margin:0 auto; padding:8px 12px 28px}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:4px}

/* ---------- dos paneles flotantes, uno en cada esquina ---------- */
.topfloat{position:sticky; top:0; height:0; z-index:30; margin-top:-8px}
.corner{
  position:absolute; top:0;
  display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px 12px;
  background:var(--paper); border:1px solid var(--line); border-top:0;
  border-radius:0 0 14px 14px; padding:7px 11px 9px; box-shadow:var(--shadow);
}
.corner.l{left:-1px; max-width:var(--pw,344px); border-left:0}
.corner.r{right:-1px; max-width:var(--pw,272px); border-right:0; justify-content:flex-end}
.menu{display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px 12px; min-width:0}
.field{display:flex; flex-direction:column; gap:2px; min-width:0}
.field>span.lab{
  font-size:9.5px; font-weight:700; letter-spacing:.12em; line-height:1.1;
  text-transform:uppercase; color:var(--ink-2); white-space:nowrap;
}
.hint{
  font-size:9.5px; font-weight:700; letter-spacing:.04em; line-height:1.1;
  color:var(--muted); white-space:nowrap; margin-top:1px;
}
body.sustain .hint{color:var(--chain2)}
body.sustain .hint::before{content:"\25CF  "; font-size:1.05em}
.ofrow{display:inline-flex; align-items:center; gap:7px}
.ofrow em{font-style:normal; font-size:13.5px; font-weight:700; color:var(--ink-2)}
.seg{display:inline-flex; border:1px solid var(--line-strong); border-radius:8px; overflow:hidden; align-self:flex-start}
.seg button{
  appearance:none; border:0; background:var(--surface); color:var(--ink-2);
  font-family:inherit; font-size:12px; font-weight:700; padding:4px 9px; cursor:pointer;
}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button.on{background:var(--ink); color:var(--paper)}
.seg button:disabled{opacity:.4; cursor:not-allowed}
.inp, .sel select, .btn{
  appearance:none; -webkit-appearance:none; font-family:inherit; font-weight:700;
  border:1px solid var(--line-strong); border-radius:8px; background:var(--surface);
  color:var(--ink); padding:3px 9px; line-height:1.3; font-size:13.5px; min-width:0;
}
.inp{width:4em; text-align:center}
.inp.num{width:3.5em}
.inp:hover, .sel select:hover, .btn:hover{border-color:var(--muted)}
.inp.bad{border-color:var(--bad); color:var(--bad)}
.sel{position:relative; display:inline-flex; min-width:0}
.sel select{padding-right:26px; cursor:pointer; max-width:100%}
.sel::after{
  content:"▾"; position:absolute; right:9px; top:50%; transform:translateY(-55%);
  font-size:10px; color:var(--caret); pointer-events:none;
}
.gen .sel select{font-size:13.5px; max-width:150px}
.hidden{display:none !important}

.chipcol{display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap}
.chip{
  width:130px; border-radius:13px; padding:5px 9px 7px; color:var(--onchip);
  display:flex; flex-direction:column; gap:3px; box-shadow:var(--shadow);
}
.chip.k1{background:var(--chain1)}
.chip.k2{background:var(--chain2)}
.chip b{font-size:11.5px; font-weight:700; letter-spacing:.11em}
.chip .sub{
  font-size:9.5px; font-weight:700; letter-spacing:.07em; line-height:1;
  margin:-2px 0 1px; color:color-mix(in srgb, var(--onchip) 80%, transparent);
}
.chip .sel, .chip .inp{width:100%}
.chip .sel select{width:100%}
.chip .sel select, .chip .inp{
  border-color:rgba(255,255,255,.45); background:rgba(255,255,255,.16); color:var(--onchip);
  font-size:12px; padding:3px 8px;
}
.chip .sel::after{color:rgba(255,255,255,.85)}
.chip .sel select:hover, .chip .inp:hover{border-color:rgba(255,255,255,.85)}
.chip .inp.bad{border-color:#FFD2D2; color:#FFD2D2}
.chip select option{background:var(--surface); color:var(--ink)}

/* ---------- lista ---------- */
.ladder{position:relative}
.ladder:not(.wheelmode){max-width:744px; margin:0 auto}
.ladder{
  --sw:15px; --s:12%;
  --c1l:19%; --c2r:19%;
  --bwmax:456px; --bw:min(420px,var(--bwmax)); --pad:16px; --tail:44px;
  --nn:46px; --nw:1fr;
}
@media (max-width:700px){ .ladder{--bwmax:392px; --tail:38px; --pad:12px} }
@media (max-width:560px){ .ladder{--bwmax:316px; --tail:34px; --s:9%; --c1l:16%; --c2r:16%} }
@media (max-width:430px){ .ladder{--bwmax:262px; --tail:28px; --s:7%; --c1l:13%; --c2r:13%; --sw:12px} }
.spine{position:absolute; top:0; bottom:2px; width:var(--sw); border-radius:9px; z-index:0}
.spine.s1{left:calc(var(--s) - var(--sw)/2); background:var(--chain1)}
.spine.s2{right:calc(var(--s) - var(--sw)/2); background:var(--chain2)}
.ladder.wheelmode .spine{display:none}
.rungs{display:flex; flex-direction:column; gap:7px; position:relative}
.ladder.wheelmode .rungs{display:block}
.rung{position:relative; height:40px; cursor:pointer}
.link{
  position:absolute; top:50%; height:13px; margin-top:-6.5px; z-index:1;
  border-radius:3px;
}

  function mul(a,b){ return simp({n:a.n*b.n, d:a.d*b.d}); }
  function dv(a,b){ return simp({n:a.n*b.d, d:a.d*b.n}); }
  function cmp(a,b){ var x=a.n*b.d, y=b.n*a.d; return x<y?-1:(x>y?1:0); }
  function reduceInto(r,p){
    var g=0;
    while(cmp(r,p)>=0 && g++<6000) r=dv(r,p);
    while(cmp(r,{n:1n,d:1n})<0 && g++<6000) r=mul(r,p);
    return r;
  }
  function fnum(r){ return Number(r.n)/Number(r.d); }
  function fcents(r){ return 1200*Math.log2(fnum(r)); }
  function fstr(r){ return r.n+"/"+r.d; }
  function parseFrac(s){
    var m=/^\s*(\d+)\s*(?:\/\s*(\d+))?\s*$/.exec(s);
    if(!m) return null;
    var n=BigInt(m[1]), d=BigInt(m[2]||"1");
    if(n<=0n||d<=0n) return null;
    return simp({n:n,d:d});
  }
  function gcdN(a,b){ while(b){ var t=a%b; a=b; b=t; } return a; }
  function dig(v){
    var s=String(v), o="", i, c;
    for(i=0;i<s.length;i++){
      c=s[i];
      o += c==="." ? '<i class="d">.</i>' : (c==="/" ? '<i class="sl">/</i>' : "<i>"+c+"</i>");
    }
    return o;
  }

  /* ---------- audio ---------- */
  var AC=null, master=null, BASE=261.6256;
  function ensureAudio(){
    if(!AC){
      AC = new (window.AudioContext||window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value=0.8; master.connect(AC.destination);
    }
    if(AC.state==="suspended") AC.resume();
  }
  var WAVES = {};
  function softWave(){
    if(!WAVES.soft){
      var n=14, real=new Float32Array(n), imag=new Float32Array(n), i;
      for(i=1;i<n;i++) imag[i] = 1/Math.pow(i,2.4);      /* caida pronunciada */
      WAVES.soft = AC.createPeriodicWave(real, imag, {disableNormalization:false});
    }
    return WAVES.soft;
  }
  /* parciales inarmonicos de campana (razones tipo Risset) */
  var BELL = [[1,1],[2.00,0.55],[2.76,0.42],[3.40,0.30],[4.19,0.22],[5.43,0.14]];
  var PEAK = { sine:0.17, soft:0.16, saw:0.085, bell:0.14 };
  /* ---------- pedal de resonancia: shift sostiene lo que suena ---------- */
  var REL=3.4, pedal=false, voices=[];
  function pin(par,t){
    if(par.cancelAndHoldAtTime){ try{ par.cancelAndHoldAtTime(t); return; }catch(e){} }
    var v=Math.max(0.0004,par.value); par.cancelScheduledValues(t); par.setValueAtTime(v,t);
  }
  function releaseVoice(v,t,fresh){
    if(v.done) return;
    v.done=true;
    var i,p;
    if(!fresh) pin(v.g.gain,t);
    v.g.gain.exponentialRampToValueAtTime(0.0004, t+REL);
    for(i=0;i<v.parts.length;i++){
      p=v.parts[i];
      if(!fresh) pin(p.g.gain,t);
      p.g.gain.exponentialRampToValueAtTime(Math.max(0.0004,p.a*0.02), t+p.dec);
    }
    for(i=0;i<v.nodes.length;i++){ try{ v.nodes[i].stop(t+REL+0.12); }catch(e){} }
  }
  function holdVoice(v,t,fresh){
    var i;
    /* congela la envolvente donde este: el pedal tambien atrapa lo que ya decae */
    if(!fresh){ pin(v.g.gain,t); for(i=0;i<v.parts.length;i++) pin(v.parts[i].g.gain,t); }
    v.done=false;
    for(i=0;i<v.nodes.length;i++){ try{ v.nodes[i].stop(t+120); }catch(e){} }
  }
  function setPedal(on){
    if(on===pedal) return;
    pedal=on;
    document.body.classList.toggle("sustain",on);
    if(!AC) return;
    var t=AC.currentTime, i, list=voices.slice();
    for(i=0;i<list.length;i++){
      /* al pisar solo se atrapa lo que aun suena; las colas apagadas se dejan morir */
      if(on){ if(list[i].g.gain.value > 0.005) holdVoice(list[i],t,false); }
      else releaseVoice(list[i],t,false);
    }
  }
  function play(cents){
    ensureAudio();
    var f = BASE*Math.pow(2,cents/1200), t = AC.currentTime, i;
    var pk = PEAK[timbre] || 0.17;
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(pk,t+0.015);
    g.gain.setValueAtTime(pk,t+0.05);
    g.connect(master);
    var v={g:g, nodes:[], parts:[], done:false};
    if(timbre==="bell"){
      for(i=0;i<BELL.length;i++){
        var bo=AC.createOscillator(); bo.type="sine";
        bo.frequency.value = f*BELL[i][0];
        var pg=AC.createGain();
        pg.gain.setValueAtTime(BELL[i][1],t);
        bo.connect(pg); pg.connect(g);
        bo.start(t); v.nodes.push(bo);
        v.parts.push({g:pg, a:BELL[i][1], dec:REL/(1+i*0.55)});
      }
    } else {
      var o=AC.createOscillator();
      if(timbre==="soft") o.setPeriodicWave(softWave());
      else o.type = (timbre==="saw") ? "sawtooth" : "sine";
      o.frequency.value = f;
      if(timbre==="saw"){
        var lp=AC.createBiquadFilter(); lp.type="lowpass";
        lp.frequency.value = Math.min(11000, f*9); lp.Q.value = 0.6;
        o.connect(lp); lp.connect(g);
      } else o.connect(g);
      o.start(t); v.nodes.push(o);
    }
    v.nodes[v.nodes.length-1].onended=function(){
      var k=voices.indexOf(v); if(k>=0) voices.splice(k,1);
      try{ g.disconnect(); }catch(e){}
    };
    voices.push(v);
    /* tope de voces sostenidas, por si el pedal se queda pisado mucho rato */
    while(voices.length>48) releaseVoice(voices.shift(), t, false);
    if(pedal) holdVoice(v, t+0.05, true);
    else releaseVoice(v, t+0.05, true);
    /* lectura desde el propio oscilador, para poder verificar la afinacion */
    var d=document.documentElement.dataset;
    d.lastfreq = v.nodes[0].frequency.value.toFixed(9);
    d.lastpartials = String(v.nodes.length);
    d.lasttimbre = timbre;
    d.lastsustain = pedal ? "1" : "0";
    d.lasttype = (timbre==="bell"||timbre==="soft") ? timbre : v.nodes[0].type;
  }

  /* ---------- etiquetas ---------- */
  function is31ed2(){ return et.N===31 && et.per.n===2n && et.per.d===1n; }
  function nameOf(s){ return is31ed2() ? NAMES31[s] : null; }
  function stepCents(){ return fcents(et.per)/et.N; }
  function etLabel(s){
    var nm=nameOf(s);
    return s+" · "+(nm ? nm : (s*stepCents()).toFixed(1)+"¢");
  }
  function fillSelect(sel, from, val){
    var h="", i;
    for(i=from;i<et.N;i++) h+='<option value="'+i+'">'+etLabel(i)+"</option>";
    sel.innerHTML=h; sel.value=val;
  }
  function remapFromCents(){
    var sc=stepCents();
    var g=Math.round(et.tc.gen/sc)%et.N; if(g<0) g+=et.N; if(g===0) g=1;
    et.gen=g;
    et.s1=((Math.round(et.tc.s1/sc)%et.N)+et.N)%et.N;
    et.s2=((Math.round(et.tc.s2/sc)%et.N)+et.N)%et.N;
  }
  function rebuildEtSelects(){
    fillSelect($("et-gen"),1,et.gen);
    fillSelect($("et-s1"),0,et.s1);
    fillSelect($("et-s2"),0,et.s2);
  }

  /* ---------- cadenas ---------- */
  function fracClass(s){
    return s.length<=9?"f1":(s.length<=13?"f2":(s.length<=17?"f3":"f4"));
  }
  function etChain(start,T){
    var out=[],k,sc=stepCents(),nm=namesAvailable()?upsDowns(et.N):null;
    for(k=0;k<T;k++){
      var s=(start+k*et.gen)%et.N;
      out.push({k:k, main:dig(s), cls:"step", name:nameOf(s), note:nm?nm[s]:null,
                cents:s*sc, txt:String(s), sort:s});
    }
    return out;
  }
  function jiChain(start){
    var out=[], seen={}, r=reduceInto(simp(start),ji.per);
    while(out.length <= ji.count){
      var key=fstr(r);
      if(seen[key]) break;
      if(r.n>TERMCAP || r.d>TERMCAP) break;
      seen[key]=1;
      out.push({k:out.length, main:dig(key), cls:fracClass(key), name:null,
                note:hejiHTML(r), heji:true,
                cents:fcents(r), txt:key, frac:r, sort:fnum(r)});
      r=reduceInto(mul(r,ji.gen),ji.per);
    }
    return out;
  }

  /* ---------- render: lista ---------- */
  function renderList(a,b){
    var total=Math.max(a.length,b.length), h="", i, j;
    for(i=0;i<total;i++){
      var hue=(i*360/total).toFixed(1), pair=[["c1",a[i]],["c2",b[i]]];
      for(j=0;j<2;j++){
        var r=pair[j][1];
        if(!r) continue;
        h+='<div class="rung '+pair[j][0]+'" style="--h:'+hue+'" tabindex="0" role="button"'+
           ' data-k="'+r.k+'" data-main="'+r.txt+'" data-cents="'+r.cents.toFixed(4)+'"'+
           ' aria-label="play '+r.txt+'">'+
           '<span class="link"></span><span class="card"></span>'+
           '<span class="body">'+
             '<span class="kpos">'+(r.k===0?"start":"+"+r.k)+"</span>"+
             '<span class="main '+r.cls+'">'+r.main+"</span>"+
             '<span class="nnote '+(r.heji?"heji":"acc")+'">'+(r.note||"")+"</span>"+
             '<span class="iname">'+(r.name||"")+"</span>"+
             '<span class="cents">'+dig(r.cents.toFixed(1))+"¢</span>"+
           "</span></div>";
      }
    }
    $("rungs").innerHTML=h;
  }

  /* ---------- render: rueda ---------- */
  /* cuanto puede subir la rueda sin que ningun nodo toque un panel de esquina */
  function cornerClear(cw, W, R1, R2, nw, nh, kOut, kIn, fk){
    var app=document.querySelector(".app");
    var ar=app.getBoundingClientRect(), pad=12;
    var L=document.querySelector(".corner.l").getBoundingClientRect();
    var Rt=document.querySelector(".corner.r").getBoundingClientRect();
    var xL=L.right-ar.left-pad, xR=Rt.left-ar.left-pad;   /* en coords del contenido */
    var cx=cw/2, need=0;
    /* cada anillo con su caja: nodos y etiquetas +k */
    var rings=[[R1,nw,nh],[R2,nw,nh],[kOut,34,fk*1.4],[kIn,34,fk*1.4]];
    var sides=[[cx-xL, L.height],[xR-cx, Rt.height]];
    for(var i=0;i<rings.length;i++){
      for(var j=0;j<sides.length;j++){
        var R=rings[i][0], bw=rings[i][1], bh=rings[i][2];
        var d=sides[j][0]-bw/2, H=sides[j][1];
        if(d>=R) continue;                     /* el circulo nunca llega a ese panel */
        if(d<0) d=0;
        var y=W/2-Math.sqrt(Math.max(0,R*R-d*d));
        need=Math.max(need, H+bh/2-y+4);
      }
    }
    return Math.max(0, need);
  }
  /* geometria de los dos anillos para un ancho dado (punto fijo en margen/hueco) */
  function ringsFor(W,T){
    var margin=46, gap=50, R1,R2,chord,nh,nw,diag,i,needM,needG;
    for(i=0;i<7;i++){
      R1 = W/2 - margin; R2 = R1 - gap; chord = 2*Math.PI*Math.max(1,R2)/T;
      nh = Math.min(40, chord*0.70);
      nw = Math.min(60, chord*0.70);
      diag = Math.sqrt(nw*nw + nh*nh)/2;
      needM = diag + 9 + 17; needG = Math.max(30, nh + 13);
      if(Math.abs(needM-margin) < 0.8 && Math.abs(needG-gap) < 0.8) break;
      margin = needM; gap = needG;
    }
    return {W:W, R1:R1, R2:R2, chord:chord, nh:nh, nw:nw, diag:diag,
            fk:(chord>=40?10.5:9), kOut:R1+diag+9, kIn:Math.max(26, R2-diag-9)};
  }
  function wheelGeom(T){
    var lad=$("ladder"), app=document.querySelector(".app");
    var sig=document.querySelector(".credit")||document.querySelector(".sig");
    var lr=lad.getBoundingClientRect();
    var top = lr.top + (window.scrollY||0);
    var below = Math.max(60, sig.getBoundingClientRect().bottom - lr.bottom) + 36;
    var cw = (app.clientWidth||744) - 24;
    var avail = (window.innerHeight||800) - top - below;
    /* los paneles se hacen tan anchos (y bajos) como puedan sin estrechar la rueda */
    var P = Math.max(168, Math.min(344, (cw - avail)/2));
    if(cw < 2*168 + 120) P = 168;
    app.style.setProperty("--pw", P.toFixed(0)+"px");
    var cap = Math.min(cw, 940);
    var clr = function(W,g){ return cornerClear(cw, W, g.R1, g.R2, g.nw, g.nh, g.kOut, g.kIn, g.fk); };
    /* opcion B: rueda ancha que baja hasta despejar los paneles */
    var W = Math.max(280, Math.min(cap, avail)), clear=0, g, c2, pass;
    for(pass=0;pass<4;pass++){
      W = Math.max(280, Math.min(cap, avail - clear));
      g = ringsFor(W,T); c2 = clr(W,g);
      if(Math.abs(c2-clear) < 1.5){ clear=c2; break; }
      clear = c2;
    }
    /* pasada de seguridad: solo encoge, asi que termina y garantiza que no choca */
    for(pass=0;pass<3;pass++){
      W = Math.max(280, Math.min(W, cap, avail - clear));
      g = ringsFor(W,T); c2 = clr(W,g);
      if(c2 <= clear + 0.5){ clear = Math.max(clear, c2); break; }
      clear = c2;
    }
    /* opcion A: rueda que cabe entre los dos paneles sin bajar nada */
    var side = Math.min(cap, avail, cw - 2*P - 40);
    if(side >= W + 8){
      var gA = ringsFor(side,T);
      if(clr(side,gA) <= 0.5){ W=side; clear=0; g=gA; }
    }
    g.top = clear;
    return g;
  }
  function wheelFits(T){
    if(T<2 || T>WHEELMAX) return false;
    var g=wheelGeom(T);
    if(g.chord < 19) return false;
    return (2*Math.PI*g.kIn/T) >= 18;
  }
  /* cuantos pasos distintos alcanzan de verdad las dos cadenas juntas */
  function coverOf(a,b){
    var seen={}, c=0, i;
    for(i=0;i<a.length;i++) if(a[i] && !seen[a[i].txt]){ seen[a[i].txt]=1; c++; }
    for(i=0;i<b.length;i++) if(b[i] && !seen[b[i].txt]){ seen[b[i].txt]=1; c++; }
    return c;
  }
  function renderWheel(a,b,T){
    var g=wheelGeom(T), W=g.W, cx=W/2, cy=W/2;
    var nh=g.nh, nw=g.nw;
    function itemsOf(r){
      return { step:r.txt,
               cents:(nw<34 ? String(Math.round(r.cents)) : r.cents.toFixed(1)+"\u00A2"),
               names:(r.note||r.txt) };
    }
    /* con nombres arriba el segundo dato son los cents: nombre + altura real */
    var second = (label==="cents") ? "step" : "cents";
    var maxChars=1, maxChars2=1, i0, it;
    for(i0=0;i0<T;i0++){
      if(a[i0]){ it=itemsOf(a[i0]);
        maxChars=Math.max(maxChars, String(it[label]).length);
        maxChars2=Math.max(maxChars2, String(it[second]).length); }
      if(b[i0]){ it=itemsOf(b[i0]);
        maxChars=Math.max(maxChars, String(it[label]).length);
        maxChars2=Math.max(maxChars2, String(it[second]).length); }
    }
    var byW  = (nw*0.94)/(maxChars*0.56);
    var byW2 = (nw*0.94)/(maxChars2*0.55);
    /* primero se intenta con dos lineas; si no cabe, una sola mas grande */
    var fm = Math.max(7, Math.min(17, byW, nh*0.50));
    var fc = Math.min(10.5, fm*0.62, byW2);
    var showSecond = (fm >= 8.5) && (fc >= 7) && (nh >= fm*1.16 + fc*1.28);
    if(!showSecond) fm = Math.max(7, Math.min(20, byW, nh*0.80));
    else fc = Math.max(7, fc);
    var h='<div class="wheel'+(showSecond?'':' nocents')+'" style="width:'+W+'px;height:'+W+'px;'+
          '--nw2:'+nw.toFixed(1)+'px;--nh2:'+nh.toFixed(1)+'px;--fm2:'+fm.toFixed(1)+'px;--fc2:'+fc.toFixed(1)+'px;--fk2:'+g.fk+'px">';
    h+='<i class="ring r1" style="width:'+(2*g.R1)+'px;height:'+(2*g.R1)+'px"></i>';
    h+='<i class="ring r2" style="width:'+(2*g.R2)+'px;height:'+(2*g.R2)+'px"></i>';
    var kOut=g.kOut, kIn=g.kIn;
    var i,j,ang,x,y;
    for(i=0;i<T;i++){
      var hue=(i*360/T).toFixed(1);
      var pair=[["c1",a[i],g.R1,(i*360/T-90),kOut],["c2",b[i],g.R2,((i+0.5)*360/T-90),kIn]];
      for(j=0;j<2;j++){
        var r=pair[j][1];
        if(!r) continue;
        ang=pair[j][3]*Math.PI/180;
        x=cx+pair[j][2]*Math.cos(ang); y=cy+pair[j][2]*Math.sin(ang);
        h+='<div class="wnode '+pair[j][0]+(r.k===0?' w0':'')+'" style="--h:'+hue+
           ';left:'+x.toFixed(1)+'px;top:'+y.toFixed(1)+'px" tabindex="0" role="button"'+
           ' data-k="'+r.k+'" data-main="'+r.txt+'" data-cents="'+r.cents.toFixed(4)+'"'+
           ' title="'+r.txt+(r.note?' · '+r.note:'')+(r.name?' · '+r.name:'')+' · '+
           r.cents.toFixed(1)+'¢ · '+(r.k===0?'start':'+'+r.k+' gen')+'"'+
           ' aria-label="play '+r.txt+'">'+
           '<b'+(label==="names"?' class="acc"':'')+'>'+itemsOf(r)[label]+'</b>'+
           (showSecond ? '<s'+(second==="names"?' class="acc"':'')+'>'+itemsOf(r)[second]+'</s>' : '')+
           '</div>';
        x=cx+pair[j][4]*Math.cos(ang); y=cy+pair[j][4]*Math.sin(ang);
        h+='<i class="klab '+(pair[j][0]==="c1"?"k1c":"k2c")+'" style="left:'+x.toFixed(1)+
           'px;top:'+y.toFixed(1)+'px">'+(r.k===0?"start":"+"+r.k)+'</i>';
      }
    }
    /* aviso central: el circulo no llega a todos los pasos del edo */
    if(mode==="et"){
      var cov = coverOf(a,b);
      if(cov < et.N){
        var gg = Math.round(et.N/T);
        var why = (cov===T)
          ? "both chains land on the same notes \u2014 shift one by 1 step"
          : "generator "+et.gen+"\\"+et.N+" only reaches every "+gg+(gg===2?"nd":(gg===3?"rd":"th"))+" step";
        var hw = Math.min(288, Math.max(92, 1.5*kIn));
        var fh = Math.max(11, Math.min(22, hw*0.15));
        var fs = Math.max(8.5, Math.min(12, fh*0.56));
        h+='<div class="hub" style="max-width:'+hw.toFixed(0)+'px;--fh2:'+fh.toFixed(1)+
           'px;--fs2:'+fs.toFixed(1)+'px"><b>'+cov+' of '+et.N+' steps</b>'+
           (hw>=168 ? '<s>'+why+'</s>' : '')+'</div>';
      }
    }
    h+='</div>';
    $("rungs").innerHTML=h;
    $("ladder").style.paddingTop = g.top.toFixed(1)+"px";
  }

  var lastA=[], lastB=[];
  function draw(){
    var a,b,note="",wheel=false;
    $("ladder").classList.toggle("ji", mode==="ji");
    if(mode==="et"){
      var T=et.N/gcdN(et.N,et.gen);
      a=etChain(et.s1,T); b=etChain(et.s2,T);
      wheel = (view==="circle") && wheelFits(T);
      note = et.N+" divisions of "+fstr(et.per).replace(/\/1$/,"")+" · "+stepCents().toFixed(3)+"¢ per step";
      if(T<et.N) note += " · each chain cycles after "+T+" steps";
      var cov = coverOf(a,b);
      if(cov<et.N) note += " · together they reach "+cov+" of the "+et.N;
      if(view==="circle" && !wheel) note += " — too many steps for the circle, showing the list";
      $("v-circle").disabled = !wheelFits(T);
    } else {
      a=jiChain(ji.s1); b=jiChain(ji.s2);
      note = "chain 1: "+a.length+" tones · chain 2: "+b.length;
      if(a.length<ji.count+1 || b.length<ji.count+1)
        note += " — a chain stopped early at exact closure or 10-digit ratios";
    }
    var canName = namesAvailable(), cat = is31ed2() && mode==="et";
    /* la lista muestra nombre de nota y categoria a la vez: ancho a medida */
    var nn = canName ? 46 : 0, catw = cat ? 148 : 0;
    var lad = $("ladder");
    lad.style.setProperty("--nn", nn+"px");
    lad.style.setProperty("--nw", catw ? "1fr" : "0px");
    lad.style.setProperty("--bw", mode==="ji" ? "min(452px, var(--bwmax))"
                                               : "min("+(192+36+nn+catw)+"px, var(--bwmax))");
    /* el switch Label solo tiene sentido en el circulo */
    var showLabel = (mode==="et" && view==="circle");
    [].forEach.call(document.querySelectorAll(".f-circle"), function(e){
      e.classList.toggle("hidden", !showLabel);
    });
    $("l-names").disabled = !canName;
    $("l-names").title = canName ? "Ups and downs note names" :
      (mode!=="et" ? "Note names need Equal mode" :
       (et.per.n!==2n||et.per.d!==1n) ? "Note names need an octave period (2)" :
       et.N+" has no usable ups-and-downs spelling (its fifth is too flat)");
    label = (labelPref==="names" && !canName) ? "step" : labelPref;
    $("l-step").classList.toggle("on", label==="step");
    $("l-cents").classList.toggle("on", label==="cents");
    $("l-names").classList.toggle("on", label==="names");
    /* atribucion segun el README de Notation: sistema de notacion + codigo + fuente */
    lastA=a; lastB=b;
    $("ladder").classList.toggle("wheelmode", wheel);
    $("note").textContent=note;
    if(wheel){ renderWheel(a,b,a.length); }
    else {
      renderList(a,b);
      var lad=$("ladder");
      lad.style.paddingTop="0px";
      var lb=lad.getBoundingClientRect(), need=0, k;
      var pans=[document.querySelector(".corner.l"), document.querySelector(".corner.r")];
      for(k=0;k<2;k++){
        var pr=pans[k].getBoundingClientRect();
        if(Math.min(pr.right,lb.right) - Math.max(pr.left,lb.left) > 0)
          need = Math.max(need, pr.bottom - lb.top + 10);
      }
      lad.style.paddingTop = need.toFixed(1)+"px";
    }
  }

  /* ---------- escala + exportes ---------- */
  function scaleData(){
    var pitches=[], seen={}, name, desc, pc;
    if(mode==="et"){
      var sc=stepCents(); pc=fcents(et.per);
      lastA.concat(lastB).forEach(function(r){
        if(r.sort===0 || seen[r.sort]) return; seen[r.sort]=1;
        pitches.push({v:r.sort*sc, s:(r.sort*sc).toFixed(6)});
      });
      pitches.sort(function(x,y){ return x.v-y.v; });
      pitches.push({v:pc, s:pc.toFixed(6)});
      name = et.N+"ed"+fstr(et.per).replace("/","-")+"_g"+et.gen+"_"+et.s1+"-"+et.s2;
      desc = et.N+" equal divisions of "+fstr(et.per)+", generator "+et.gen+"\\"+et.N
           + " ("+(et.gen*sc).toFixed(3)+"c), chains from steps "+et.s1+" and "+et.s2;
    } else {
      pc=fcents(ji.per);
      lastA.concat(lastB).forEach(function(r){
        if(r.txt==="1/1" || seen[r.txt]) return; seen[r.txt]=1;
        pitches.push({v:fcents(r.frac), s:r.txt});
      });
      pitches.sort(function(x,y){ return x.v-y.v; });
      pitches.push({v:pc, s:fstr(ji.per)});
      name = "ji_g"+fstr(ji.gen).replace("/","-")+"_"+fstr(ji.s1).replace("/","-")+"_"+fstr(ji.s2).replace("/","-");
      desc = "Just intonation, generator "+fstr(ji.gen)+" over period "+fstr(ji.per)
           + ", chains from "+fstr(ji.s1)+" and "+fstr(ji.s2);
    }
    return { pitches:pitches, pc:pc, name:name, desc:desc };
  }
  function sclBody(d,ext){
    var L=["! "+d.name+"."+ext,"!",d.desc," "+d.pitches.length,"!"];
    d.pitches.forEach(function(p){ L.push(" "+p.s); });
    return L;
  }
  function buildScl(){
    var d=scaleData();
    return { filename:d.name+".scl", text:sclBody(d,"scl").join("\n")+"\n", count:d.pitches.length };
  }
  function buildAscl(){
    var d=scaleData(), L=sclBody(d,"ascl");
    L.push("!");
    L.push("! @ABL REFERENCE_PITCH 4 0 "+BASE);
    L.push("! @ABL SOURCE Generator Chains");
    return { filename:d.name+".ascl", text:L.join("\n")+"\n", count:d.pitches.length };
  }
  function buildTun(){
    var d=scaleData(), S=d.pitches.length, i, dd, q, r, c;
    function deg(r){ return r===0 ? 0 : d.pitches[r-1].v; }
    var ints=[], exact=[];
    for(i=0;i<128;i++){
      dd=i-60; q=Math.floor(dd/S); r=dd-q*S;
      c=6000 + q*d.pc + deg(r);
      ints.push("Note "+i+" = "+Math.round(c));
      exact.push("Note "+i+" = "+c.toFixed(6));
    }
    var L=["; AnaMark tuning map","; "+d.desc,"; MIDI note 60 = "+BASE+" Hz","",
      "[Scale Begin]",'Format = "AnaMark-TUN"',"FormatVersion = 200",
      'FormatSpecs = "http://www.mark-henning.de/eternity/tuningspecs.html"',"",
      "[Info]",'Name = "'+d.name+'"','ID = "'+d.name+'"','Filename = "'+d.name+'.tun"',
      'Description = "'+d.desc+'"',"","[Tuning]"].concat(ints,
      ["","[Exact Tuning]","BaseFreq = "+BASEFREQ], exact, ["","[Scale End]",""]);
    return { filename:d.name+".tun", text:L.join("\n"), count:S };
  }
  function buildFile(f){
    return f==="scl" ? buildScl() : (f==="ascl" ? buildAscl() : buildTun());
  }
  window.__scale = buildFile;

  /* ---------- descarga ---------- */
  var dlNote=$("dlnote"), saver=null, saverTried=false;
  async function getSaver(){
    if(saver) return saver;
    for(var i=0;i<12;i++){
      if(window.claude && window.claude.use){
        try{ saver = await window.claude.use("downloads"); }catch(e){ saver=null; }
        return saver;
      }
      await new Promise(function(res){ setTimeout(res,250); });
    }
    return null;
  }
  getSaver();
  function showModal(f){
    $("mtitle").innerHTML='This viewer cannot save files directly — copy the text and save it as <b>'+f.filename+'</b>';
    $("mtext").value=f.text;
    $("modal").classList.remove("hidden");
    try{
      var u=URL.createObjectURL(new Blob([f.text],{type:"text/plain"}));
      var a=document.createElement("a"); a.href=u; a.download=f.filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(u); },4000);
    }catch(e){}
  }
  $("mclose").addEventListener("click",function(){ $("modal").classList.add("hidden"); });
  $("mcopy").addEventListener("click",function(){
    var t=$("mtext"); t.focus(); t.select();
    var done=false;
    try{ done=document.execCommand("copy"); }catch(e){}
    if(!done && navigator.clipboard){ navigator.clipboard.writeText(t.value); done=true; }
    $("mcopy").textContent = done ? "Copied ✓" : "Copy";
    setTimeout(function(){ $("mcopy").textContent="Copy"; },1500);
  });
  async function runDownload(){
    var f=buildFile(fmt);
    dlNote.textContent="";
    var s2=await getSaver();
    if(!s2){ showModal(f); return; }
    try{
      await s2.save({filename:f.filename, data:f.text});
      dlNote.textContent="saved · "+f.count+" degrees";
    }catch(e){
      var code=e && e.code;
      if(code==="rejected_extension" || code==="extension_not_enabled"){
        try{
          await s2.save({filename:f.filename+".txt", data:f.text});
          dlNote.textContent="saved as "+f.filename+".txt — rename it to ."+fmt;
        }catch(e2){
          if(e2 && e2.code==="declined") dlNote.textContent="download cancelled";
          else showModal(f);
        }
      } else if(code==="declined"){ dlNote.textContent="download cancelled"; }
      else if(code==="rate_limited"){ dlNote.textContent="a prompt is already open — try again in a moment"; }
      else { showModal(f); }
    }
  }
  [].forEach.call(document.querySelectorAll(".fmt"), function(b){
    b.addEventListener("click", function(){
      fmt=b.dataset.f;
      [].forEach.call(document.querySelectorAll(".fmt"), function(x){ x.classList.toggle("on", x===b); });
      runDownload();
    });
  });
  $("dl").addEventListener("click", function(){
    var box=$("fmts"), open=box.classList.toggle("hidden")===false;
    $("dl").setAttribute("aria-expanded", open?"true":"false");
    dlNote.textContent = open ? "" : dlNote.textContent;
  });

  /* ---------- interaccion ---------- */
  var dragging=false, lastEl=null;
  function noteAt(x,y){
    var el=document.elementFromPoint(x,y);
    return (el && el.closest) ? el.closest("[data-cents]") : null;
  }
  $("rungs").addEventListener("pointerdown", function(e){
    var r=e.target.closest("[data-cents]");
    if(!r) return;
    play(+r.dataset.cents);
    lastEl=r;
    if(e.pointerType!=="touch"){ dragging=true; e.preventDefault(); }
  });
  window.addEventListener("pointermove", function(e){
    if(!dragging) return;
    var r=noteAt(e.clientX,e.clientY);
    if(r && r!==lastEl){ lastEl=r; play(+r.dataset.cents); }
  });
  window.addEventListener("pointerup", function(){ dragging=false; lastEl=null; });
  window.addEventListener("pointercancel", function(){ dragging=false; lastEl=null; });
  /* shift = pedal de resonancia */
  window.addEventListener("keydown", function(e){
    if(e.key==="Shift" && !e.repeat) setPedal(true);
  });
  window.addEventListener("keyup", function(e){ if(e.key==="Shift") setPedal(false); });
  window.addEventListener("blur", function(){ setPedal(false); });
  $("rungs").addEventListener("keydown", function(e){
    if(e.key!=="Enter" && e.key!==" ") return;
    var r=e.target.closest("[data-cents]");
    if(r){ e.preventDefault(); play(+r.dataset.cents); }
  });

  /* ---------- controles ---------- */
  function setMode(m){
    mode=m;
    $("m-et").classList.toggle("on",m==="et");
    $("m-ji").classList.toggle("on",m==="ji");
    var els=document.querySelectorAll(".f-et"), i;
    for(i=0;i<els.length;i++) els[i].classList.toggle("hidden",m!=="et");
    els=document.querySelectorAll(".f-ji");
    for(i=0;i<els.length;i++) els[i].classList.toggle("hidden",m!=="ji");
    dlNote.textContent="";
    draw();
  }
  $("m-et").addEventListener("click",function(){ setMode("et"); });
  $("m-ji").addEventListener("click",function(){ setMode("ji"); });
  function setView(v){
    view=v;
    $("v-circle").classList.toggle("on",v==="circle");
    $("v-list").classList.toggle("on",v==="list");
    draw();
  }
  $("v-circle").addEventListener("click",function(){ setView("circle"); });
  function setLabel(v){
    if(v==="names" && !namesAvailable()) return;
    labelPref=v;
    draw();
  }
  $("l-step").addEventListener("click",function(){ setLabel("step"); });
  $("l-cents").addEventListener("click",function(){ setLabel("cents"); });
  $("l-names").addEventListener("click",function(){ setLabel("names"); });
  $("timbre").addEventListener("change",function(){ timbre=this.value; });
  $("v-list").addEventListener("click",function(){ setView("list"); });

  $("divs").addEventListener("change",function(){
    var v=Math.round(+this.value);
    if(!(v>=2&&v<=311)){ this.classList.add("bad"); return; }
    this.classList.remove("bad");
    et.N=v; remapFromCents(); rebuildEtSelects(); draw();
  });
  $("ji-count").addEventListener("change",function(){
    var v=Math.round(+this.value);
    if(!(v>=1&&v<=99)){ this.classList.add("bad"); return; }
    this.classList.remove("bad"); ji.count=v; draw();
  });
  function fracInput(id,apply){
    $(id).addEventListener("change",function(){
      var f=parseFrac(this.value);
      if(!f || !apply(f)){ this.classList.add("bad"); return; }
      this.classList.remove("bad"); draw();
    });
  }
  fracInput("et-per",function(f){
    if(cmp(f,{n:1n,d:1n})<=0) return false;
    et.per=f; remapFromCents(); rebuildEtSelects(); return true;
  });
  fracInput("ji-gen",function(f){ ji.gen=f; return true; });
  fracInput("ji-s1",function(f){ ji.s1=f; return true; });
  fracInput("ji-s2",function(f){ ji.s2=f; return true; });
  $("et-gen").addEventListener("change",function(){
    et.gen=+this.value; et.tc.gen=et.gen*stepCents(); draw();
  });
  $("et-s1").addEventListener("change",function(){
    et.s1=+this.value; et.tc.s1=et.s1*stepCents(); draw();
  });
  $("et-s2").addEventListener("change",function(){
    et.s2=+this.value; et.tc.s2=et.s2*stepCents(); draw();
  });

  var rsz=null;
  window.addEventListener("resize", function(){
    if(mode!=="et" || view!=="circle") return;
    clearTimeout(rsz); rsz=setTimeout(draw,150);
  });

  rebuildEtSelects();
  draw();
})();
</script>
