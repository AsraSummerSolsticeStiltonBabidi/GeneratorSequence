<title>Generator Chains</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --paper:#FCFBFD; --surface:#FFFFFF;
  --ink:#17151E; --ink-2:#443F4F; --muted:#6C6779;
  --line:#E2DFE9; --line-strong:#C7C2D3;
  --tint:15%; --tint-hi:30%;
  --cl:0.505; --cc:0.16;
  --chain1:#D93A3E; --chain2:#2E63E7; --onchip:#FFFFFF;
  --shadow:0 1px 2px rgba(23,21,30,.05), 0 8px 24px -18px rgba(23,21,30,.5);
  --caret:#6C6779; --bad:#C92C2C; --scrim:rgba(23,21,30,.45);
  --k1lab:#A0242A; --k2lab:#1C46B4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111017; --surface:#18161F;
    --ink:#F3F0F8; --ink-2:#C6C0D3; --muted:#948DA5;
    --line:#2D2936; --line-strong:#413B50;
    --tint:24%; --tint-hi:40%;
    --cl:0.80; --cc:0.145;
    --chain1:#E4575B; --chain2:#4E7DF2; --onchip:#FFFFFF;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.9);
    --caret:#948DA5; --bad:#FF7B7B; --scrim:rgba(0,0,0,.6);
    --k1lab:#FF9DA0; --k2lab:#9DB8FF;
  }
}
:root[data-theme="dark"]{
  --paper:#111017; --surface:#18161F;
  --ink:#F3F0F8; --ink-2:#C6C0D3; --muted:#948DA5;
  --line:#2D2936; --line-strong:#413B50;
  --tint:24%; --tint-hi:40%;
  --cl:0.80; --cc:0.145;
  --chain1:#E4575B; --chain2:#4E7DF2; --onchip:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.9);
  --caret:#948DA5; --bad:#FF7B7B; --scrim:rgba(0,0,0,.6);
  --k1lab:#FF9DA0; --k2lab:#9DB8FF;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Comic Neue","Comic Sans MS","Chalkboard SE","Segoe Print",cursive;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.app{max-width:980px; margin:0 auto; padding:8px 12px 28px}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:4px}

/* ---------- top: menu izquierda + chips derecha ---------- */
.topwrap{
  position:sticky; top:0; z-index:30; background:var(--paper);
  display:flex; justify-content:space-between; align-items:flex-start;
  gap:12px 18px; flex-wrap:wrap;
  padding:5px 2px 7px; border-bottom:1px solid var(--line); margin-bottom:8px;
}
.menu{display:flex; flex-direction:column; gap:8px}
.mrow{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:flex-end}
.field{display:flex; flex-direction:column; gap:2px; min-width:0}
.field>span.lab{
  font-size:9.5px; font-weight:700; letter-spacing:.12em; line-height:1.1;
  text-transform:uppercase; color:var(--ink-2); white-space:nowrap;
}
.ofrow{display:inline-flex; align-items:center; gap:7px}
.ofrow em{font-style:normal; font-size:13.5px; font-weight:700; color:var(--ink-2)}
.seg{display:inline-flex; border:1px solid var(--line-strong); border-radius:8px; overflow:hidden; align-self:flex-start}
.seg button{
  appearance:none; border:0; background:var(--surface); color:var(--ink-2);
  font-family:inherit; font-size:12.5px; font-weight:700; padding:4px 11px; cursor:pointer;
}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button.on{background:var(--ink); color:var(--paper)}
.seg button:disabled{opacity:.4; cursor:not-allowed}
.inp, .sel select, .btn{
  appearance:none; -webkit-appearance:none; font-family:inherit; font-weight:700;
  border:1px solid var(--line-strong); border-radius:8px; background:var(--surface);
  color:var(--ink); padding:3px 9px; line-height:1.3; font-size:13.5px; min-width:0;
}
.inp{width:4.6em; text-align:center}
.inp.num{width:4em}
.inp:hover, .sel select:hover, .btn:hover{border-color:var(--muted)}
.inp.bad{border-color:var(--bad); color:var(--bad)}
.sel{position:relative; display:inline-flex; min-width:0}
.sel select{padding-right:26px; cursor:pointer; max-width:100%}
.sel::after{
  content:"▾"; position:absolute; right:9px; top:50%; transform:translateY(-55%);
  font-size:10px; color:var(--caret); pointer-events:none;
}
.gen .sel select{font-size:14px; max-width:168px}
.hidden{display:none !important}

.chipcol{display:flex; gap:10px; align-items:flex-start}
.chip{
  width:140px; border-radius:13px; padding:5px 9px 7px; color:var(--onchip);
  display:flex; flex-direction:column; gap:3px; box-shadow:var(--shadow);
}
.chip.k1{background:var(--chain1)}
.chip.k2{background:var(--chain2)}
.chip b{font-size:11.5px; font-weight:700; letter-spacing:.11em}
.chip .sel, .chip .inp{width:100%}
.chip .sel select{width:100%}
.chip .sel select, .chip .inp{
  border-color:rgba(255,255,255,.45); background:rgba(255,255,255,.16); color:var(--onchip);
  font-size:12px; padding:3px 8px;
}
.chip .sel::after{color:rgba(255,255,255,.85)}
.chip .sel select:hover, .chip .inp:hover{border-color:rgba(255,255,255,.85)}
.chip .inp.bad{border-color:#FFD2D2; color:#FFD2D2}
.chip select option{background:var(--surface); color:var(--ink)}

/* ---------- lista ---------- */
.ladder{position:relative}
.ladder:not(.wheelmode){max-width:744px; margin:0 auto}
.ladder{
  --sw:15px; --s:12%;
  --c1l:19%; --c2r:19%;
  --bw:356px; --pad:16px; --tail:56px; --nw:1fr;
}
@media (max-width:700px){ .ladder{--bw:300px; --tail:48px; --pad:12px} }
@media (max-width:560px){ .ladder{--bw:242px; --tail:46px; --s:9%; --c1l:16%; --c2r:16%; --nw:0px} }
@media (max-width:430px){ .ladder{--bw:206px; --tail:44px; --s:7%; --c1l:13%; --c2r:13%; --sw:12px} }
.spine{position:absolute; top:0; bottom:2px; width:var(--sw); border-radius:9px; z-index:0}
.spine.s1{left:calc(var(--s) - var(--sw)/2); background:var(--chain1)}
.spine.s2{right:calc(var(--s) - var(--sw)/2); background:var(--chain2)}
.ladder.wheelmode .spine{display:none}
.rungs{display:flex; flex-direction:column; gap:7px; position:relative}
.ladder.wheelmode .rungs{display:block}
.rung{position:relative; height:40px; cursor:pointer}
.link{
  position:absolute; top:50%; height:13px; margin-top:-6.5px; z-index:1;
  border-radius:3px;
}
.rung.c1 .link{left:var(--s); right:calc(100% - var(--c1l) - 12px); background:var(--chain1)}
.rung.c2 .link{left:calc(100% - var(--c2r) - 12px); right:var(--s); background:var(--chain2)}
.card{
  --c:oklch(var(--cl) var(--cc) var(--h));
  position:absolute; top:0; bottom:0; z-index:2;
  background:color-mix(in srgb, var(--c) var(--tint), var(--surface));
  border:1px solid color-mix(in srgb, var(--c) 40%, var(--line));
  box-shadow:var(--shadow);
}
.rung.c1 .card{
  left:var(--c1l); right:calc(50% - var(--bw)/2 - var(--pad));
  border-radius:5px 20px 20px 5px;
}
.rung.c2 .card{
  left:calc(50% - var(--bw)/2 - var(--tail)); right:var(--c2r);
  border-radius:20px 5px 5px 20px;
}
.rung:hover .card{background:color-mix(in srgb, var(--c) var(--tint-hi), var(--surface))}
.rung:active .card{transform:scale(.995)}
.body{
  position:absolute; top:0; bottom:0; left:50%; transform:translateX(-50%);
  width:var(--bw); z-index:3; pointer-events:none;
  display:grid; align-items:center; gap:0 10px;
  grid-template-columns:38px 106px var(--nw) 48px;
}
.ladder.ji .body{grid-template-columns:38px 1fr 0px 48px}
.kpos{font-size:12.5px; font-weight:700; color:var(--ink); white-space:nowrap}
.main{
  --c:oklch(var(--cl) var(--cc) var(--h));
  font-weight:700; color:var(--c); text-align:right; white-space:nowrap;
}
.main.step{font-size:19px}
.main.f1{font-size:17px} .main.f2{font-size:15px}
.main.f3{font-size:13px} .main.f4{font-size:11.5px}
.iname{
  font-size:12.5px; color:var(--ink-2); padding-left:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ladder.ji .iname{display:none}
.cents{font-size:11.5px; color:var(--ink-2); text-align:right; white-space:nowrap}
.body i{display:inline-block; width:.62em; text-align:center; font-style:normal}
.body i.d{width:.3em} .body i.sl{width:.4em}

/* ---------- rueda ---------- */
.wheel{position:relative; margin:2px auto 0}
.ring{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  border-radius:50%; border:5px solid; z-index:0;
}
.ring.r1{border-color:var(--chain1)}
.ring.r2{border-color:var(--chain2)}
.hub{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  text-align:center; z-index:1; pointer-events:none;
}
.hub em{font-style:normal; font-size:14px; color:var(--ink-2)}
.wnode{
  --c:oklch(var(--cl) var(--cc) var(--h));
  position:absolute; transform:translate(-50%,-50%); z-index:2;
  width:var(--nw2); height:var(--nh2); border-radius:9px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer; user-select:none; gap:0;
  background:color-mix(in srgb, var(--c) var(--tint), var(--surface));
  border:1.5px solid color-mix(in srgb, var(--c) 45%, var(--line));
  box-shadow:var(--shadow);
}
.wnode.c1{outline:2.5px solid color-mix(in srgb, var(--chain1) 70%, transparent)}
.wnode.c2{outline:2.5px solid color-mix(in srgb, var(--chain2) 70%, transparent)}
.wnode:hover{background:color-mix(in srgb, var(--c) var(--tint-hi), var(--surface)); z-index:4}
.wnode:active{transform:translate(-50%,-50%) scale(.95)}
.wnode b{font-size:var(--fm2); font-weight:700; color:var(--c); line-height:1.05}
.wnode s{font-size:var(--fc2); text-decoration:none; color:var(--ink-2); font-weight:700; line-height:1.15; white-space:nowrap}
.wheel.nocents .wnode s{display:none}
.wnode.w0{outline-width:3.5px}
.klab{
  position:absolute; transform:translate(-50%,-50%); z-index:1;
  font-size:var(--fk2); font-weight:700; white-space:nowrap; pointer-events:none;
}
.klab.k1c{color:var(--k1lab)}
.klab.k2c{color:var(--k2lab)}

/* ---------- pie ---------- */
.foot{
  display:flex; align-items:center; justify-content:center; flex-wrap:wrap;
  gap:6px 14px; margin-top:10px;
}
.note{font-size:12px; color:var(--ink-2); text-align:center; padding:0 4px; margin:0}
.dlrow{display:flex; align-items:center; gap:8px}
.btn{cursor:pointer; padding:5px 13px; box-shadow:var(--shadow)}
.sig{margin:8px 0 0; text-align:center; font-size:12.5px; font-style:italic; color:var(--muted)}

/* ---------- modal de copia ---------- */
.modal{
  position:fixed; inset:0; z-index:50; background:var(--scrim);
  display:flex; align-items:center; justify-content:center; padding:16px;
}
.mbox{
  background:var(--surface); border:1px solid var(--line-strong); border-radius:14px;
  box-shadow:var(--shadow); width:min(560px,94vw); padding:14px 16px 14px;
  display:flex; flex-direction:column; gap:10px;
}
.mbox p{margin:0; font-size:13.5px}
.mbox p b{word-break:break-all}
.mbox textarea{
  width:100%; height:240px; resize:vertical; font-family:ui-monospace,Menlo,monospace;
  font-size:11px; line-height:1.35; color:var(--ink); background:var(--paper);
  border:1px solid var(--line-strong); border-radius:8px; padding:8px;
}
.mrow2{display:flex; gap:8px; justify-content:flex-end}
</style>

<div class="app">
  <div class="topwrap">
    <div class="menu">
      <div class="mrow">
        <div class="field"><span class="lab">Mode</span>
          <span class="seg">
            <button type="button" id="m-et" class="on">Equal</button><button type="button" id="m-ji">JI</button>
          </span>
        </div>
        <div class="field f-et"><span class="lab">Divisions</span>
          <span class="ofrow">
            <input class="inp num" id="divs" type="number" min="2" max="311" step="1" value="31" inputmode="numeric">
            <em>of</em>
            <input class="inp" id="et-per" type="text" value="2" spellcheck="false">
          </span>
        </div>
        <div class="field f-et"><span class="lab">View</span>
          <span class="seg">
            <button type="button" id="v-circle" class="on">Circle</button><button type="button" id="v-list">List</button>
          </span>
        </div>
        <div class="field gen"><span class="lab">Generator</span>
          <span class="sel f-et"><select id="et-gen"></select></span>

        </div>
        <div class="field f-ji hidden"><span class="lab">Generators</span>
          <input class="inp num" id="ji-count" type="number" min="1" max="99" step="1" value="15" inputmode="numeric">
        </div>
      </div>
    </div>
    <div class="chipcol">
      <div class="chip k1"><b>CHAIN 1</b>
        <span class="sel f-et"><select id="et-s1"></select></span>
        <input class="inp f-ji hidden" id="ji-s1" type="text" value="1/1" spellcheck="false">
      </div>
      <div class="chip k2"><b>CHAIN 2</b>
        <span class="sel f-et"><select id="et-s2"></select></span>

  <div class="ladder" id="ladder">

      <span class="seg">
        <button type="button" class="fmt on" data-f="tun">.tun</button><button type="button" class="fmt" data-f="scl">.scl</button><button type="button" class="fmt" data-f="ascl">.ascl</button>
      </span>
      <button type="button" class="btn" id="dl">Download tuning file</button>
    </div>
  </div>
  <p class="sig">vibe coded by ASRA3</p>
</div>

<div class="modal hidden" id="modal">
  <div class="mbox">
    <p id="mtitle"></p>
    <textarea id="mtext" readonly spellcheck="false"></textarea>
    <div class="mrow2">
      <button type="button" class="btn" id="mcopy">Copy</button>
      <button type="button" class="btn" id="mclose">Close</button>
    </div>
  </div>
</div>

<script>
(function(){
  var NAMES31 = ["Unison","Diesis","Subminor second","Minor second","Neutral second",
    "Major second","Supermajor second","Subminor third","Minor third","Neutral third",
    "Major third","Supermajor third","Subfourth","Perfect fourth","Superfourth",
    "Augmented fourth","Diminished fifth","Subfifth","Perfect fifth","Superfifth",
    "Subminor sixth","Minor sixth","Neutral sixth","Major sixth","Supermajor sixth",
    "Subminor seventh","Minor seventh","Neutral seventh","Major seventh",
    "Supermajor seventh","Sub-octave"];

  var $ = function(id){ return document.getElementById(id); };
  var mode="et", view="circle", fmt="tun";
  var et = { N:31, per:{n:2n,d:1n}, gen:18, s1:0, s2:10,
             tc:{ gen:696.774193548, s1:0, s2:387.096774194 } };
  var ji = { per:{n:2n,d:1n}, gen:{n:3n,d:2n}, s1:{n:1n,d:1n}, s2:{n:5n,d:4n}, count:15 };
  var TERMCAP = 10000000000n, WHEELMAX = 60, BASEFREQ = 8.175798915643707;

  /* ---------- fracciones ---------- */
  function bgcd(a,b){ while(b){ var t=a%b; a=b; b=t; } return a<0n?-a:a; }
  function simp(r){ var g=bgcd(r.n,r.d); return {n:r.n/g, d:r.d/g}; }
  function mul(a,b){ return simp({n:a.n*b.n, d:a.d*b.d}); }
  function dv(a,b){ return simp({n:a.n*b.d, d:a.d*b.n}); }
  function cmp(a,b){ var x=a.n*b.d, y=b.n*a.d; return x<y?-1:(x>y?1:0); }
  function reduceInto(r,p){
    var g=0;
    while(cmp(r,p)>=0 && g++<6000) r=dv(r,p);
    while(cmp(r,{n:1n,d:1n})<0 && g++<6000) r=mul(r,p);
    return r;
  }
  function fnum(r){ return Number(r.n)/Number(r.d); }
  function fcents(r){ return 1200*Math.log2(fnum(r)); }
  function fstr(r){ return r.n+"/"+r.d; }
  function parseFrac(s){
    var m=/^\s*(\d+)\s*(?:\/\s*(\d+))?\s*$/.exec(s);
    if(!m) return null;
    var n=BigInt(m[1]), d=BigInt(m[2]||"1");
    if(n<=0n||d<=0n) return null;
    return simp({n:n,d:d});
  }
  function gcdN(a,b){ while(b){ var t=a%b; a=b; b=t; } return a; }
  function dig(v){
    var s=String(v), o="", i, c;
    for(i=0;i<s.length;i++){
      c=s[i];
      o += c==="." ? '<i class="d">.</i>' : (c==="/" ? '<i class="sl">/</i>' : "<i>"+c+"</i>");
    }
    return o;
  }

  /* ---------- audio ---------- */
  var AC=null, master=null, BASE=261.6256;
  function ensureAudio(){
    if(!AC){
      AC = new (window.AudioContext||window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value=0.8; master.connect(AC.destination);
    }
    if(AC.state==="suspended") AC.resume();
  }
  function play(cents){
    ensureAudio();
    var f = BASE*Math.pow(2,cents/1200), t = AC.currentTime;
    var o = AC.createOscillator(); o.type="sine"; o.frequency.value=f;
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.17,t+0.015);
    g.gain.setValueAtTime(0.17,t+0.05);
    g.gain.exponentialRampToValueAtTime(0.0004,t+3.4);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+3.5);
    o.onended=function(){ try{ g.disconnect(); }catch(e){} };
    document.documentElement.dataset.lastfreq = f.toFixed(3);
  }

  /* ---------- etiquetas ---------- */
  function is31ed2(){ return et.N===31 && et.per.n===2n && et.per.d===1n; }
  function nameOf(s){ return is31ed2() ? NAMES31[s] : null; }
  function stepCents(){ return fcents(et.per)/et.N; }
  function etLabel(s){
    var nm=nameOf(s);
    return s+" · "+(nm ? nm : (s*stepCents()).toFixed(1)+"¢");
  }
  function fillSelect(sel, from, val){
    var h="", i;
    for(i=from;i<et.N;i++) h+='<option value="'+i+'">'+etLabel(i)+"</option>";
    sel.innerHTML=h; sel.value=val;
  }
  function remapFromCents(){
    var sc=stepCents();
    var g=Math.round(et.tc.gen/sc)%et.N; if(g<0) g+=et.N; if(g===0) g=1;
    et.gen=g;
    et.s1=((Math.round(et.tc.s1/sc)%et.N)+et.N)%et.N;
    et.s2=((Math.round(et.tc.s2/sc)%et.N)+et.N)%et.N;
  }
  function rebuildEtSelects(){
    fillSelect($("et-gen"),1,et.gen);
    fillSelect($("et-s1"),0,et.s1);
    fillSelect($("et-s2"),0,et.s2);
  }

  /* ---------- cadenas ---------- */
  function fracClass(s){
    return s.length<=9?"f1":(s.length<=13?"f2":(s.length<=17?"f3":"f4"));
  }
  function etChain(start,T){
    var out=[],k,sc=stepCents();
    for(k=0;k<T;k++){
      var s=(start+k*et.gen)%et.N;
      out.push({k:k, main:dig(s), cls:"step", name:nameOf(s), cents:s*sc, txt:String(s), sort:s});
    }
    return out;
  }
  function jiChain(start){
    var out=[], seen={}, r=reduceInto(simp(start),ji.per);
    while(out.length <= ji.count){
      var key=fstr(r);
      if(seen[key]) break;
      if(r.n>TERMCAP || r.d>TERMCAP) break;
      seen[key]=1;
      out.push({k:out.length, main:dig(key), cls:fracClass(key), name:null,
                cents:fcents(r), txt:key, frac:r, sort:fnum(r)});
      r=reduceInto(mul(r,ji.gen),ji.per);
    }
    return out;
  }

  /* ---------- render: lista ---------- */
  function renderList(a,b){
    var total=Math.max(a.length,b.length), h="", i, j;
    for(i=0;i<total;i++){
      var hue=(i*360/total).toFixed(1), pair=[["c1",a[i]],["c2",b[i]]];
      for(j=0;j<2;j++){
        var r=pair[j][1];
        if(!r) continue;
        h+='<div class="rung '+pair[j][0]+'" style="--h:'+hue+'" tabindex="0" role="button"'+
           ' data-k="'+r.k+'" data-main="'+r.txt+'" data-cents="'+r.cents.toFixed(4)+'"'+
           ' aria-label="play '+r.txt+'">'+
           '<span class="link"></span><span class="card"></span>'+
           '<span class="body">'+
             '<span class="kpos">'+(r.k===0?"start":"+"+r.k)+"</span>"+
             '<span class="main '+r.cls+'">'+r.main+"</span>"+
             '<span class="iname">'+(r.name||"")+"</span>"+
             '<span class="cents">'+dig(r.cents.toFixed(1))+"¢</span>"+
           "</span></div>";
      }
    }
    $("rungs").innerHTML=h;
  }

  /* ---------- render: rueda ---------- */
  function wheelGeom(T){
    var host=$("rungs"), r=host.getBoundingClientRect();
    var app=document.querySelector(".app"), sig=document.querySelector(".sig");
    var top = r.top + (window.scrollY||0);
    /* alto real del pie: distancia de la base de la escalera al final de la firma */
    var below = Math.max(60, sig.getBoundingClientRect().bottom - r.bottom) + 36;
    var availH = (window.innerHeight||800) - top - below;
    var W = Math.min((app.clientWidth||744) - 24, 940);
    W = Math.max(280, Math.min(W, availH));

    /* margen exterior y separacion de anillos: convergen en pocas pasadas */
    var margin=46, gap=50, R1, R2, chord, nh, nw, diag, showCents, i, needM, needG;
    for(i=0;i<7;i++){
      R1 = W/2 - margin; R2 = R1 - gap; chord = 2*Math.PI*Math.max(1,R2)/T;
      showCents = chord >= 36;
      nh = showCents ? Math.min(38, chord*0.66) : Math.min(26, chord*0.60);
      nw = showCents ? Math.min(56, chord*0.78) : Math.min(44, chord*0.76);
      diag = Math.sqrt(nw*nw + nh*nh)/2;
      needM = diag + 9 + 17; needG = Math.max(30, nh + 13);
      if(Math.abs(needM-margin) < 0.8 && Math.abs(needG-gap) < 0.8) break;
      margin = needM; gap = needG;
    }
    var fm = nw>=50?17:(nw>=40?15:(nw>=30?13:11));
    var fc = nw>=50?10.5:(nw>=36?9.5:8.5);
    var fk = chord>=40?10.5:9;
    return {W:W, R1:R1, R2:R2, chord:chord, nh:nh, nw:nw, diag:diag,
            showCents:showCents, fm:fm, fc:fc, fk:fk,
            kOut:R1+diag+9, kIn:Math.max(26, R2-diag-9)};
  }
  function wheelFits(T){
    if(T<2 || T>WHEELMAX) return false;
    var g=wheelGeom(T);
    if(g.chord < 19) return false;
    return (2*Math.PI*g.kIn/T) >= 18;
  }
  function renderWheel(a,b,T){
    var g=wheelGeom(T), W=g.W, cx=W/2, cy=W/2;
    var nh=g.nh, nw=g.nw, showCents=g.showCents;
    var h='<div class="wheel'+(showCents?'':' nocents')+'" style="width:'+W+'px;height:'+W+'px;'+
          '--nw2:'+nw.toFixed(1)+'px;--nh2:'+nh.toFixed(1)+'px;--fm2:'+g.fm+'px;--fc2:'+g.fc+'px;--fk2:'+g.fk+'px">';
    h+='<i class="ring r1" style="width:'+(2*g.R1)+'px;height:'+(2*g.R1)+'px"></i>';
    h+='<i class="ring r2" style="width:'+(2*g.R2)+'px;height:'+(2*g.R2)+'px"></i>';
    h+='<div class="hub"><em>closes after '+T+'</em></div>';
    var kOut=g.kOut, kIn=g.kIn;
    var i,j,ang,x,y;
    for(i=0;i<T;i++){
      var hue=(i*360/T).toFixed(1);
      var pair=[["c1",a[i],g.R1,(i*360/T-90),kOut],["c2",b[i],g.R2,((i+0.5)*360/T-90),kIn]];
      for(j=0;j<2;j++){
        var r=pair[j][1];
        if(!r) continue;
        ang=pair[j][3]*Math.PI/180;
        x=cx+pair[j][2]*Math.cos(ang); y=cy+pair[j][2]*Math.sin(ang);
        h+='<div class="wnode '+pair[j][0]+(r.k===0?' w0':'')+'" style="--h:'+hue+
           ';left:'+x.toFixed(1)+'px;top:'+y.toFixed(1)+'px" tabindex="0" role="button"'+
           ' data-k="'+r.k+'" data-main="'+r.txt+'" data-cents="'+r.cents.toFixed(4)+'"'+
           ' title="'+r.txt+(r.name?' · '+r.name:'')+' · '+r.cents.toFixed(1)+'¢ · '+
           (r.k===0?'start':'+'+r.k+' gen')+'"'+
           ' aria-label="play '+r.txt+'">'+
           '<b>'+r.main+'</b><s>'+r.cents.toFixed(1)+'¢</s></div>';
        x=cx+pair[j][4]*Math.cos(ang); y=cy+pair[j][4]*Math.sin(ang);
        h+='<i class="klab '+(pair[j][0]==="c1"?"k1c":"k2c")+'" style="left:'+x.toFixed(1)+
           'px;top:'+y.toFixed(1)+'px">'+(r.k===0?"start":"+"+r.k)+'</i>';
      }
    }
    h+='</div>';
    $("rungs").innerHTML=h;
  }

  var lastA=[], lastB=[];
  function draw(){
    var a,b,note="",wheel=false;
    $("ladder").classList.toggle("ji", mode==="ji");
    if(mode==="et"){
      var T=et.N/gcdN(et.N,et.gen);
      a=etChain(et.s1,T); b=etChain(et.s2,T);
      wheel = (view==="circle") && wheelFits(T);
      note = et.N+" divisions of "+fstr(et.per).replace(/\/1$/,"")+" · "+stepCents().toFixed(3)+"¢ per step";
      if(T<et.N) note = "generator "+et.gen+"\\"+et.N+" cycles after "+T+" steps — it reaches only "+T+" of the "+et.N;
      else if(view==="circle" && !wheel) note += " — too many steps for the circle, showing the list";
      $("v-circle").disabled = !wheelFits(T);
    } else {
      a=jiChain(ji.s1); b=jiChain(ji.s2);
      note = "chain 1: "+a.length+" tones · chain 2: "+b.length;
      if(a.length<ji.count+1 || b.length<ji.count+1)
        note += " — a chain stopped early at exact closure or 10-digit ratios";
    }
    lastA=a; lastB=b;
    $("ladder").classList.toggle("wheelmode", wheel);
    $("note").textContent=note;
    if(wheel) renderWheel(a,b,a.length); else renderList(a,b);
  }

  /* ---------- escala + exportes ---------- */
  function scaleData(){
    var pitches=[], seen={}, name, desc, pc;
    if(mode==="et"){
      var sc=stepCents(); pc=fcents(et.per);
      lastA.concat(lastB).forEach(function(r){
        if(r.sort===0 || seen[r.sort]) return; seen[r.sort]=1;
        pitches.push({v:r.sort*sc, s:(r.sort*sc).toFixed(6)});
      });
      pitches.sort(function(x,y){ return x.v-y.v; });
      pitches.push({v:pc, s:pc.toFixed(6)});
      name = et.N+"ed"+fstr(et.per).replace("/","-")+"_g"+et.gen+"_"+et.s1+"-"+et.s2;
      desc = et.N+" equal divisions of "+fstr(et.per)+", generator "+et.gen+"\\"+et.N
           + " ("+(et.gen*sc).toFixed(3)+"c), chains from steps "+et.s1+" and "+et.s2;
    } else {
      pc=fcents(ji.per);
      lastA.concat(lastB).forEach(function(r){
        if(r.txt==="1/1" || seen[r.txt]) return; seen[r.txt]=1;
        pitches.push({v:fcents(r.frac), s:r.txt});
      });
      pitches.sort(function(x,y){ return x.v-y.v; });
      pitches.push({v:pc, s:fstr(ji.per)});
      name = "ji_g"+fstr(ji.gen).replace("/","-")+"_"+fstr(ji.s1).replace("/","-")+"_"+fstr(ji.s2).replace("/","-");
      desc = "Just intonation, generator "+fstr(ji.gen)+" over period "+fstr(ji.per)
           + ", chains from "+fstr(ji.s1)+" and "+fstr(ji.s2);
    }
    return { pitches:pitches, pc:pc, name:name, desc:desc };
  }
  function sclBody(d,ext){
    var L=["! "+d.name+"."+ext,"!",d.desc," "+d.pitches.length,"!"];
    d.pitches.forEach(function(p){ L.push(" "+p.s); });
    return L;
  }
  function buildScl(){
    var d=scaleData();
    return { filename:d.name+".scl", text:sclBody(d,"scl").join("\n")+"\n", count:d.pitches.length };
  }
  function buildAscl(){
    var d=scaleData(), L=sclBody(d,"ascl");
    L.push("!");
    L.push("! @ABL REFERENCE_PITCH 4 0 "+BASE);
    L.push("! @ABL SOURCE Generator Chains");
    return { filename:d.name+".ascl", text:L.join("\n")+"\n", count:d.pitches.length };
  }
  function buildTun(){
    var d=scaleData(), S=d.pitches.length, i, dd, q, r, c;
    function deg(r){ return r===0 ? 0 : d.pitches[r-1].v; }
    var ints=[], exact=[];
    for(i=0;i<128;i++){
      dd=i-60; q=Math.floor(dd/S); r=dd-q*S;
      c=6000 + q*d.pc + deg(r);
      ints.push("Note "+i+" = "+Math.round(c));
      exact.push("Note "+i+" = "+c.toFixed(6));
    }
    var L=["; AnaMark tuning map","; "+d.desc,"; MIDI note 60 = "+BASE+" Hz","",
      "[Scale Begin]",'Format = "AnaMark-TUN"',"FormatVersion = 200",
      'FormatSpecs = "http://www.mark-henning.de/eternity/tuningspecs.html"',"",
      "[Info]",'Name = "'+d.name+'"','ID = "'+d.name+'"','Filename = "'+d.name+'.tun"',
      'Description = "'+d.desc+'"',"","[Tuning]"].concat(ints,
      ["","[Exact Tuning]","BaseFreq = "+BASEFREQ], exact, ["","[Scale End]",""]);
    return { filename:d.name+".tun", text:L.join("\n"), count:S };
  }
  function buildFile(f){
    return f==="scl" ? buildScl() : (f==="ascl" ? buildAscl() : buildTun());
  }
  window.__scale = buildFile;

  /* ---------- descarga ---------- */
  var dlNote=$("dlnote"), saver=null, saverTried=false;
  async function getSaver(){
    if(saver) return saver;
    for(var i=0;i<12;i++){
      if(window.claude && window.claude.use){
        try{ saver = await window.claude.use("downloads"); }catch(e){ saver=null; }
        return saver;
      }
      await new Promise(function(res){ setTimeout(res,250); });
    }
    return null;
  }
  getSaver();
  function showModal(f){
    $("mtitle").innerHTML='This viewer cannot save files directly — copy the text and save it as <b>'+f.filename+'</b>';
    $("mtext").value=f.text;
    $("modal").classList.remove("hidden");
    try{
      var u=URL.createObjectURL(new Blob([f.text],{type:"text/plain"}));
      var a=document.createElement("a"); a.href=u; a.download=f.filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(u); },4000);
    }catch(e){}
  }
  $("mclose").addEventListener("click",function(){ $("modal").classList.add("hidden"); });
  $("mcopy").addEventListener("click",function(){
    var t=$("mtext"); t.focus(); t.select();
    var done=false;
    try{ done=document.execCommand("copy"); }catch(e){}
    if(!done && navigator.clipboard){ navigator.clipboard.writeText(t.value); done=true; }
    $("mcopy").textContent = done ? "Copied ✓" : "Copy";
    setTimeout(function(){ $("mcopy").textContent="Copy"; },1500);
  });
  [].forEach.call(document.querySelectorAll(".fmt"), function(b){
    b.addEventListener("click", function(){
      fmt=b.dataset.f;
      [].forEach.call(document.querySelectorAll(".fmt"), function(x){ x.classList.toggle("on", x===b); });
      dlNote.textContent="";
    });
  });
  $("dl").addEventListener("click", async function(){
    var f=buildFile(fmt);
    dlNote.textContent="";
    var s=await getSaver();
    if(!s){ showModal(f); return; }
    try{
      await s.save({filename:f.filename, data:f.text});
      dlNote.textContent="saved · "+f.count+" degrees";
    }catch(e){
      var code=e && e.code;
      if(code==="rejected_extension" || code==="extension_not_enabled"){
        try{
          await s.save({filename:f.filename+".txt", data:f.text});
          dlNote.textContent="saved as "+f.filename+".txt — rename it to ."+fmt;
        }catch(e2){
          if(e2 && e2.code==="declined") dlNote.textContent="download cancelled";
          else showModal(f);
        }
      } else if(code==="declined"){ dlNote.textContent="download cancelled"; }
      else if(code==="rate_limited"){ dlNote.textContent="a prompt is already open — try again in a moment"; }
      else { showModal(f); }
    }
  });

  /* ---------- interaccion ---------- */
  var dragging=false, lastEl=null;
  function noteAt(x,y){
    var el=document.elementFromPoint(x,y);
    return (el && el.closest) ? el.closest("[data-cents]") : null;
  }
  $("rungs").addEventListener("pointerdown", function(e){
    var r=e.target.closest("[data-cents]");
    if(!r) return;
    play(+r.dataset.cents);
    lastEl=r;
    if(e.pointerType!=="touch"){ dragging=true; e.preventDefault(); }
  });
  window.addEventListener("pointermove", function(e){
    if(!dragging) return;
    var r=noteAt(e.clientX,e.clientY);
    if(r && r!==lastEl){ lastEl=r; play(+r.dataset.cents); }
  });
  window.addEventListener("pointerup", function(){ dragging=false; lastEl=null; });
  window.addEventListener("pointercancel", function(){ dragging=false; lastEl=null; });
  $("rungs").addEventListener("keydown", function(e){
    if(e.key!=="Enter" && e.key!==" ") return;
    var r=e.target.closest("[data-cents]");
    if(r){ e.preventDefault(); play(+r.dataset.cents); }
  });

  /* ---------- controles ---------- */
  function setMode(m){
    mode=m;
    $("m-et").classList.toggle("on",m==="et");
    $("m-ji").classList.toggle("on",m==="ji");
    var els=document.querySelectorAll(".f-et"), i;
    for(i=0;i<els.length;i++) els[i].classList.toggle("hidden",m!=="et");
    els=document.querySelectorAll(".f-ji");
    for(i=0;i<els.length;i++) els[i].classList.toggle("hidden",m!=="ji");
    dlNote.textContent="";
    draw();
  }
  $("m-et").addEventListener("click",function(){ setMode("et"); });
  $("m-ji").addEventListener("click",function(){ setMode("ji"); });
  function setView(v){
    view=v;
    $("v-circle").classList.toggle("on",v==="circle");
    $("v-list").classList.toggle("on",v==="list");
    draw();
  }
  $("v-circle").addEventListener("click",function(){ setView("circle"); });
  $("v-list").addEventListener("click",function(){ setView("list"); });

  $("divs").addEventListener("change",function(){
    var v=Math.round(+this.value);
    if(!(v>=2&&v<=311)){ this.classList.add("bad"); return; }
    this.classList.remove("bad");
    et.N=v; remapFromCents(); rebuildEtSelects(); draw();
  });
  $("ji-count").addEventListener("change",function(){
    var v=Math.round(+this.value);
    if(!(v>=1&&v<=99)){ this.classList.add("bad"); return; }
    this.classList.remove("bad"); ji.count=v; draw();
  });
  function fracInput(id,apply){
    $(id).addEventListener("change",function(){
      var f=parseFrac(this.value);
      if(!f || !apply(f)){ this.classList.add("bad"); return; }
      this.classList.remove("bad"); draw();
    });
  }
  fracInput("et-per",function(f){
    if(cmp(f,{n:1n,d:1n})<=0) return false;
    et.per=f; remapFromCents(); rebuildEtSelects(); return true;
  });
  fracInput("ji-gen",function(f){ ji.gen=f; return true; });
  fracInput("ji-s1",function(f){ ji.s1=f; return true; });
  fracInput("ji-s2",function(f){ ji.s2=f; return true; });
  $("et-gen").addEventListener("change",function(){
    et.gen=+this.value; et.tc.gen=et.gen*stepCents(); draw();
  });
  $("et-s1").addEventListener("change",function(){
    et.s1=+this.value; et.tc.s1=et.s1*stepCents(); draw();
  });
  $("et-s2").addEventListener("change",function(){
    et.s2=+this.value; et.tc.s2=et.s2*stepCents(); draw();
  });

  var rsz=null;
  window.addEventListener("resize", function(){
    if(mode!=="et" || view!=="circle") return;
    clearTimeout(rsz); rsz=setTimeout(draw,150);
  });

  rebuildEtSelects();
  draw();
})();
</script>
